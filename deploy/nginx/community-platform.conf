# Install in /etc/nginx/sites-available/ and enable after replacing the domain
# and certificate paths with values for the selected host.
log_format community_privacy '$time_iso8601 "$request_method $uri" $status $request_time';

upstream community_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream community_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name community.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name community.example.org;

    ssl_certificate /etc/letsencrypt/live/community.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CommunityTLS:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/community-platform-access.log community_privacy;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api {
        return 308 /api/;
    }

    # Next.js owns this health route; other /api/ requests go to Fastify.
    location = /api/health {
        proxy_pass http://community_web/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://community_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://community_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://community_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://community_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
